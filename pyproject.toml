[project]
name = "paddock"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "paddock-cli",
    "telemetrylib",
]

[tool.uv.workspace]
members = [
    "apps/paddock-cli",
    "libs/telemetrylib",
]

[tool.uv.sources]
paddock-cli = { workspace = true }
telemetrylib = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
