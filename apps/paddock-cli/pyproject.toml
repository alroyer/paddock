[project]
name = "paddock-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "python-dotenv>=1.2.4",
    "telemetrylib",
    "typer>=0.27.3",
]

[project.scripts]
paddock-cli = "paddock_cli.main:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
telemetrylib = { workspace = true }
